<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1d2410">
  
  <title>Brewhaus Café</title>
  <meta name="description" content="Welcome to Brewhaus Café. View our menu, contact us, leave a review, or message us on WhatsApp.">
  
  <!-- Open Graph Tags -->
  <meta property="og:title" content="Brewhaus Café">
  <meta property="og:description" content="Welcome to Brewhaus Café. View our menu, contact us, leave a review, or message us on WhatsApp.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1200&q=80">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/app-icon.svg">
  <link rel="icon" href="/favicon.ico" sizes="any">

  <!-- Only allowed external resource: Google Font Playfair Display with Georgia fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-layer" id="bgLayer"></div>
  <div class="overlay-layer" id="overlayLayer"></div>

  <main class="page-container" id="pageContainer">
    <!-- Header: Logo, Café Name, Tagline, Down Chevron -->
    <header class="profile-header">
      <div class="logo-wrapper" id="logoWrapper" aria-label="Café Logo">
        <!-- Rendered dynamically via CONFIG -->
      </div>
      <h1 class="cafe-name" id="cafeName"></h1>
      <p class="tagline" id="tagline"></p>
      
      <div class="chevron-wrapper" aria-hidden="true">
        <svg class="chevron-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </header>

    <!-- Five Stacked Pill Buttons -->
    <nav class="links-nav" id="linksNav" aria-label="Café Quick Links">
      <!-- Buttons rendered dynamically via CONFIG -->
    </nav>

    <!-- Footer -->
    <footer class="page-footer">
      <p id="footerText"></p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
