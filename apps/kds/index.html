<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f59e0b" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="description" content="Café Kitchen Display System (KDS) — Live Ticket Board for Chefs and Baristas" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kitchen Display (KDS) · Chef & Barista Orders</title>
  </head>
  <body class="bg-stone-950 select-none text-stone-100">
    <div id="root">
      <!-- High-fidelity Instant Loading Shell (displayed until React mounts) -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0c0a09; color: #f5f5f4; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 20px; background-color: #f59e0b; color: #1c1917; font-size: 28px; font-weight: 800; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4);">
          🍳
        </div>
        <div style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 9999px; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; font-size: 11px; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em;">
          <span style="display: inline-block; width: 6px; height: 6px; border-radius: 9999px; background-color: #f59e0b;"></span>
          Kitchen Display (KDS)
        </div>
        <h2 style="font-size: 20px; font-weight: 800; color: #ffffff; margin: 0 0 6px 0; letter-spacing: -0.02em;">Loading Kitchen Queue...</h2>
        <p style="font-size: 12px; color: #a8a29e; margin: 0 0 24px 0; max-width: 320px;">Connecting to live orders stream & chef preparation board</p>
        <div style="width: 36px; height: 36px; border: 3px solid rgba(245, 158, 11, 0.2); border-top-color: #f59e0b; border-radius: 50%; animation: kdsSpin 0.9s linear infinite;"></div>
        <style>@keyframes kdsSpin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
