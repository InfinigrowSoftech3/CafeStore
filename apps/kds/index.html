<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="description" content="Café Kitchen Display System (KDS) — Live Ticket Board for Chefs and Baristas" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kitchen Display (KDS) · Chef & Barista Orders</title>
    <!-- Premium Café Typography: Playfair Display + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F8F6F2] select-none text-[#1C1815] antialiased">
    <div id="root">
      <!-- High-fidelity Instant Loading Shell (displayed until React mounts) -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F8F6F2; color: #1C1815; font-family: 'Inter', system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 68px; height: 68px; border-radius: 20px; background-color: #FFFFFF; border: 1px solid #E5DED5; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06); overflow: hidden;">
          <img src="/logo.png" alt="Logo" style="width: 48px; height: 48px; object-fit: contain;" />
        </div>
        <div style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 9999px; background: rgba(184, 115, 20, 0.1); border: 1px solid rgba(184, 115, 20, 0.25); color: #B87314; font-size: 11px; font-weight: 700; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.08em;">
          <span style="display: inline-block; width: 6px; height: 6px; border-radius: 9999px; background-color: #B87314;"></span>
          Kitchen Display (KDS)
        </div>
        <h2 style="font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 700; color: #1C1815; margin: 0 0 8px 0; letter-spacing: -0.01em;">Loading Kitchen Queue...</h2>
        <p style="font-size: 13px; color: #6E645B; margin: 0 0 28px 0; max-width: 320px;">Connecting to live orders stream & chef preparation board</p>
        <div style="width: 38px; height: 38px; border: 3px solid rgba(184, 115, 20, 0.2); border-top-color: #B87314; border-radius: 50%; animation: kdsSpin 0.9s linear infinite;"></div>
        <style>@keyframes kdsSpin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
