<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1B4D" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="description" content="Brewhaus Platform — Super Administrator Command Center & Multi-Tenant Management Console" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Brewhaus Platform · Super Admin Command Center</title>
    <!-- Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F5F7FC] text-[#1B2559] antialiased">
    <div id="root">
      <!-- High-fidelity Instant Loading Shell (displayed until React mounts) -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0B1B4D; color: #FFFFFF; font-family: 'Inter', system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 68px; height: 68px; border-radius: 20px; background: rgba(30, 63, 174, 0.25); border: 1px solid rgba(212, 175, 55, 0.4); color: #D4AF37; font-size: 32px; font-weight: 800; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);">
          ⚡
        </div>
        <div style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 9999px; background: rgba(212, 175, 55, 0.12); border: 1px solid rgba(212, 175, 55, 0.3); color: #D4AF37; font-size: 11px; font-weight: 700; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.1em;">
          <span style="display: inline-block; width: 6px; height: 6px; border-radius: 9999px; background-color: #D4AF37; box-shadow: 0 0 8px #D4AF37;"></span>
          Super Admin Console
        </div>
        <h2 style="font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-size: 22px; font-weight: 700; color: #FFFFFF; margin: 0 0 8px 0; letter-spacing: -0.01em;">Initializing Platform Authority...</h2>
        <p style="font-size: 13px; color: #8E9BBF; margin: 0 0 28px 0; max-width: 340px;">Synchronizing multi-tenant metrics, audit ledger, and security protocols</p>
        <div style="width: 38px; height: 38px; border: 3px solid rgba(212, 175, 55, 0.2); border-top-color: #D4AF37; border-radius: 50%; animation: saSpin 0.9s linear infinite;"></div>
        <style>@keyframes saSpin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
