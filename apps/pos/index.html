<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#14110F" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="description" content="Café POS Counter Terminal — Touch Register & Offline Order Processing" />
    <meta name="robots" content="noindex, nofollow" />
    <title>POS Terminal · Counter & Cashier Register</title>
    <!-- Premium Café Typography: Playfair Display + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#14110F] text-[#F5EDE0] select-none antialiased">
    <div id="root">
      <!-- High-fidelity Instant Loading Shell (displayed until React mounts) -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #14110F; color: #F5EDE0; font-family: 'Inter', system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 68px; height: 68px; border-radius: 20px; background-color: #28211B; border: 1px solid #3A3028; color: #D9A441; font-size: 32px; font-weight: 800; margin-bottom: 20px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);">
          ☕
        </div>
        <div style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 9999px; background: rgba(217, 164, 65, 0.12); border: 1px solid rgba(217, 164, 65, 0.3); color: #D9A441; font-size: 11px; font-weight: 700; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.08em;">
          <span style="display: inline-block; width: 6px; height: 6px; border-radius: 9999px; background-color: #D9A441;"></span>
          Counter POS Terminal
        </div>
        <h2 style="font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 700; color: #F5EDE0; margin: 0 0 8px 0; letter-spacing: -0.01em;">Starting Register Terminal...</h2>
        <p style="font-size: 13px; color: #A89A88; margin: 0 0 28px 0; max-width: 320px;">Synchronizing catalog, offline memory, and ticket system</p>
        <div style="width: 38px; height: 38px; border: 3px solid rgba(217, 164, 65, 0.2); border-top-color: #D9A441; border-radius: 50%; animation: posSpin 0.9s linear infinite;"></div>
        <style>@keyframes posSpin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
