services:
  - type: web
    name: brewhaus-cafe-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/readyz
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://cafestore-customer.vercel.app
      - key: CUSTOMER_APP_URL
        value: https://cafestore-customer.vercel.app
      - key: POS_APP_URL
        value: https://cafestore-pos.vercel.app
      - key: KDS_APP_URL
        value: https://cafestore-kds.vercel.app
      - key: ADMIN_APP_URL
        value: https://cafestore-admin.vercel.app
      - key: SERVER_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: SENTRY_DSN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TABLE_QR_SECRET
        sync: false
      - key: TENANT_CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: ALLOW_TEST_PAYMENTS
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
  - type: redis
    name: brewhaus-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: allkeys-lru
